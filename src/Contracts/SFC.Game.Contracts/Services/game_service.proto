syntax = "proto3";

package sfc_game;

import "Messages/Game/General/Get/get_game_request.proto";
import "Messages/Game/General/Get/get_game_response.proto";
import "Messages/Game/General/Find/get_games_request.proto";
import "Messages/Game/General/Find/get_games_response.proto";

option csharp_namespace = "SFC.Game.Contracts.Services";

service GameService {
    rpc GetGame(GetGameRequest) returns (GetGameResponse);
    rpc GetGames(GetGamesRequest) returns (GetGamesResponse);
}