syntax = "proto3";

package sfc_game;

import "Messages/Game/Team/Player/Get/get_game_team_player_request.proto";
import "Messages/Game/Team/Player/Get/get_game_team_player_response.proto";
import "Messages/Game/Team/Player/Find/get_game_team_players_request.proto";
import "Messages/Game/Team/Player/Find/get_game_team_players_response.proto";

option csharp_namespace = "SFC.Game.Contracts.Services";

service GameTeamPlayerService {
    rpc GetGameTeamPlayer(GetGameTeamPlayerRequest) returns (GetGameTeamPlayerResponse);
    rpc GetGameTeamPlayers(GetGameTeamPlayersRequest) returns (GetGameTeamPlayersResponse);
}