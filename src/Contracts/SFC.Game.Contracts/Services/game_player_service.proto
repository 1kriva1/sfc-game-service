syntax = "proto3";

package sfc_game;

import "Messages/Game/Player/Get/get_game_player_request.proto";
import "Messages/Game/Player/Get/get_game_player_response.proto";
import "Messages/Game/Player/Find/get_game_players_request.proto";
import "Messages/Game/Player/Find/get_game_players_response.proto";

option csharp_namespace = "SFC.Game.Contracts.Services";

service GamePlayerService {
    rpc GetGamePlayer(GetGamePlayerRequest) returns (GetGamePlayerResponse);
    rpc GetGamePlayers(GetGamePlayersRequest) returns (GetGamePlayersResponse);
}