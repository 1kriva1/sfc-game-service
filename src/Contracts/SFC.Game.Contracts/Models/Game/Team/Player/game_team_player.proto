syntax = "proto3";

package sfc_game;

option csharp_namespace = "SFC.Game.Contracts.Models.Game.Team.Player";

message GameTeamPlayer
{
    int64 id = 1;
    string user_id = 2;
    int64 game_team_id = 3;
    int64 game_id = 4;
    int64 team_id = 5;
    int64 player_id = 6;
    int32 status_id = 7;
}