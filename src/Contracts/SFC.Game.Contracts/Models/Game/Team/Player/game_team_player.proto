syntax = "proto3";

package sfc_game;

import "google/protobuf/wrappers.proto";

option csharp_namespace = "SFC.Game.Contracts.Models.Game.Team.Player";

message GameTeamPlayer
{
    int64 id = 1;
    string user_id = 2;
    int64 game_team_id = 3;
    google.protobuf.Int64Value game_player_id = 4;
    google.protobuf.Int64Value team_player_id = 5;
}