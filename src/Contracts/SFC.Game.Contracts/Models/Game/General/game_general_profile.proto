syntax = "proto3";

package sfc_game;

import "google/protobuf/wrappers.proto";
import "Models/Game/General/game_availability.proto";

option csharp_namespace = "SFC.Game.Contracts.Models.Game.General";

message GameGeneralProfile
{
    string name = 1;
    google.protobuf.StringValue description = 2;
    google.protobuf.Int32Value location = 3;
    GameAvailability availability = 4;
    repeated string tags = 5;
}