syntax = "proto3";

package sfc_game;

import "google/protobuf/wrappers.proto";
import "Messages/Game/General/Find/Filters/games_availability_limit.proto";

option csharp_namespace = "SFC.Game.Contracts.Messages.Game.General.Find.Filters";

message GamesGeneralProfileFilter
{
    google.protobuf.StringValue name = 1;
    repeated string tags = 2;
    GamesAvailabilityLimit availability = 3;
    google.protobuf.Int32Value location = 4;
}